name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:latest
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build backend
        run: |
          cd auth-service
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests
      - name: Run backend tests
        run: |
          cd auth-service
          ./mvnw test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          cd auth-frontend
          npm ci
      - name: Build frontend
        run: |
          cd auth-frontend
          npm run build

  docker-compose:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4 
      - name: Build and run Docker Compose
        run: |
          docker-compose up --build -d